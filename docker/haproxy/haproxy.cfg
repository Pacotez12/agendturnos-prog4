global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option forwardfor
    # Si un nodo recien caido aun no figura DOWN, la conexion fallida se reintenta
    # en el otro nodo: el usuario no ve el error durante la deteccion.
    retries 2
    option redispatch 1
    # En la red interna conectar tarda ms; 1 s acota la espera ante un nodo recien caido
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    # Un nodo recien arrancado compila en frio y /health puede tardar ~5 s con el
    # codigo montado desde Windows. Un nodo detenido falla antes, por timeout connect.
    timeout check 10s
    # Health check cada 3 s: 3 fallos seguidos -> DOWN (~9 s), 2 aciertos -> UP.
    # init-addr none: HAProxy arranca aunque un nodo este apagado.
    default-server check inter 3s fall 3 rise 2 resolvers docker init-addr last,libc,none

# DNS interno de Docker. Si se detiene un contenedor su nombre deja de resolver:
# hold nx conserva la ultima IP para que el nodo figure DOWN (no en mantenimiento)
# y al volver se toma la IP nueva.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s
    hold nx 1h
    hold timeout 1h
    hold refused 1h
    hold other 1h
    hold obsolete 1h

frontend http
    bind *:80
    default_backend laravel

backend laravel
    # roundrobin: las peticiones son cortas y parecidas, y la sesion vive en Redis,
    # asi que no hace falta pegar al usuario a un nodo. leastconn conviene con
    # conexiones largas (websockets, descargas), que esta app no tiene.
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    # Muestra que nodo atendio la peticion (para la demo y el benchmark)
    http-response set-header X-Servidor %s
    server a_nginx web:80
    server b_apache apache:80

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
