name: agendturnos

services:
  # ---------------------------------------------------------------------------
  # Arquitectura A: PHP-FPM 8.4 + Nginx (app + web)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
      args:
        UID: 1000
        GID: 1000
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
      args:
        UID: 1000
        GID: 1000
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3
    volumes:
      - .:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
      args:
        UID: 1000
        GID: 1000
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro,z
    depends_on:
      - app

  # ---------------------------------------------------------------------------
  # Arquitectura B: Apache + mod_php, mismo codigo, misma BD y mismo Redis que A
  # ---------------------------------------------------------------------------
  apache:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
      args:
        UID: 1000
        GID: 1000
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # HAProxy: balancea entre A (web) y B (apache). Stats en :8404
  # ---------------------------------------------------------------------------
  haproxy:
    build:
      context: .
      dockerfile: docker/haproxy/Dockerfile
    restart: unless-stopped
    ports:
      - "${HAPROXY_PORT_FORWARD:-8000}:80"
      - "127.0.0.1:8404:8404"
    depends_on:
      - web
      - apache

  # Compila los assets del frontend (Tailwind + Alpine via Vite) y los
  # recompila al guardar. Nadie necesita Node instalado en su maquina.
  node:
    image: node:24-alpine
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
    command: sh -c "npm install && npm run build -- --watch"
    volumes:
      - .:/var/www/html:z

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-agendturnos}
      POSTGRES_USER: ${DB_USERNAME:-agendturnos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agendturnos}
    ports:
      - "127.0.0.1:${DB_PORT_FORWARD:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-agendturnos} -d ${DB_DATABASE:-agendturnos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT_FORWARD:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
